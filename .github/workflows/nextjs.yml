name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main  # 'main' 브랜치에 푸시하면 실행

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      # 1. GitHub Repository 체크아웃
      - name: Checkout repository
        uses: actions/checkout@v3

      # 2. Node.js 환경 설정
      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '19'  # Node.js 버전 설정
          cache: 'pnpm'       # pnpm 사용 시 종속성 캐시 활성화

      # 3. pnpm 설치
      - name: Install pnpm
        run: npm install -g pnpm   # pnpm 전역 설치

      # 4. 의존성 설치
      - name: Install dependencies
        run: pnpm install          # pnpm으로 의존성 설치

      # 5. 빌드 실행
      - name: Build project
        run: pnpm run build        # 빌드 명령어 실행

      # 6. GitHub Pages 배포
      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./out        # 배포 폴더
